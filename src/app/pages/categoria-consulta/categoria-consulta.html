<div class="min-h-screen bg-gradient-to-br from-black via-slate-950 to-blue-950 text-white">
  <app-navbar />

  <div class="flex min-h-[calc(100vh-73px)] flex-col lg:flex-row">
    <app-sidebar />

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-white">Consulta de categorias</h2>
        <p class="mt-2 text-sm text-blue-200/70">
          Consulte as categorias criadas para organizar as tarefas da sua agenda.
        </p>
      </div>

      <section class="rounded-2xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-blue-950/40 backdrop-blur">
        <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="mt-1 text-sm text-blue-200/70">
              Total de categorias exibidas:
              <span class="font-semibold text-blue-300">{{categorias().length}}</span>
            </p>
          </div>
        </div>

        <table class="w-full min-w-[600px] border-collapse">
          <thead class="bg-slate-950/80">
            <tr>
              <th class="px-4 py-4 text-left text-sm font-semibold text-blue-100">
                Nome
              </th>
              <th class="px-4 py-4 text-right text-sm font-semibold text-blue-100">
                Ações
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-white/10 bg-slate-950/40">
            
            @for(item of categorias(); track item.id) {
              <tr class="transition hover:bg-white/5">
              <td class="px-4 py-4 text-sm text-white">
                {{item.nome | uppercase }}
              </td>
              <td class="px-4 py-4">
                <div class="flex justify-end gap-2">
                  
                  <button type="button" [routerLink]="['/categoria-edicao', item.id]"
                    class="rounded-lg border border-blue-400/40 px-4 py-2 text-sm font-medium text-blue-200 transition hover:bg-blue-500/20 hover:text-white">
                    Editar
                  </button>

                  <button type="button" (click)="excluirCategoria(item.id)"
                    class="rounded-lg border border-red-400/40 px-4 py-2 text-sm font-medium text-red-200 transition hover:bg-red-500/20 hover:text-white">
                    Excluir
                  </button>
                </div>
              </td>
            </tr>
            }          
          </tbody>
        </table>
      </section>
    </main>
  </div>
</div>
