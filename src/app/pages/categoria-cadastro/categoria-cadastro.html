<div class="min-h-screen bg-gradient-to-br from-black via-slate-950 to-blue-950 text-white">
  <app-navbar />

  <div class="flex min-h-[calc(100vh-73px)] flex-col lg:flex-row">
    <app-sidebar />

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-white">Cadastro de categorias</h2>
        <p class="mt-2 text-sm text-blue-200/70">
          Crie categorias para organizar as tarefas da sua agenda.
        </p>
      </div>

      <section
        class="max-w-2xl rounded-2xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-blue-950/40 backdrop-blur">
        
        <form class="space-y-6" [formGroup]="formCadastro" (ngSubmit)="cadastrarCategoria()">
          
          <div>
            <label for="nomeCategoria" class="mb-2 block text-sm font-medium text-blue-100">
              Nome da categoria
            </label>

            <input id="nomeCategoria" formControlName="nome" type="text" placeholder="Ex: Trabalho, Estudos, Pessoal"
              class="w-full rounded-xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30" />
          </div>

          <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
            <button type="reset"
              class="rounded-xl border border-white/10 px-5 py-3 text-sm font-medium text-blue-100 transition hover:bg-white/10">
              Limpar
            </button>

            <button type="submit" [disabled]="formCadastro.invalid"
              class="rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-600/30 transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-slate-950">
              Cadastrar categoria
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
